name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and dependency safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  quality:
    name: Ruff, Black, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --retries 10 --timeout 120 --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --retries 10 --timeout 120 -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  docker-postgres:
    name: Docker and pgvector benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip download --retries 10 --timeout 120 --dest wheels --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - run: docker compose config -q
      - run: docker compose build app
      - run: docker compose up -d db
      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U schemadrill_admin -d schemadrill; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - run: docker compose run --rm app python -m eval.benchmark
      - name: Run Chinook evaluator smoke test
        run: docker compose run --rm app python -m evaluation.runner --gold-as-generated --dataset chinook
      - name: Run instrumented benchmark smoke test
        run: |
          docker compose run --rm app sh -c \
            'python -m evaluation.run_benchmark \
              --questions evaluation/chinook/cases.json \
              --dataset chinook \
              --gold-as-generated \
              --output-dir /tmp/schemadrill-benchmark &&
             test -n "$(find /tmp/schemadrill-benchmark -name "*_summary.json" -size +0c -print -quit)"'
      - name: Run synthetic dataset registry smoke test
        run: |
          docker compose run --rm app sh -c \
            'python -m evaluation.run_benchmark \
              --all-datasets \
              --gold-as-generated \
              --initialize \
              --output-dir /tmp/schemadrill-multidataset &&
             test -n "$(find /tmp/schemadrill-multidataset -name "*_summary.json" -size +0c -print -quit)"'
      - run: docker compose up -d app
      - name: Check API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down -v

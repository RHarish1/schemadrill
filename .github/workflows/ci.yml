name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, Black, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --retries 10 --timeout 120 --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --retries 10 --timeout 120 -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  docker-postgres:
    name: Docker and pgvector benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip download --retries 10 --timeout 120 --dest wheels --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - run: docker compose config -q
      - run: docker compose build app
      - run: docker compose up -d db
      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U schemadrill_admin -d schemadrill; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - run: docker compose run --rm app python -m eval.benchmark
      - name: Run Chinook evaluator smoke test
        run: docker compose run --rm app python -m evaluation.runner --gold-as-generated --dataset chinook
      - run: docker compose up -d app
      - name: Check API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down -v

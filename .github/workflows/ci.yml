name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and dependency safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  quality:
    name: Ruff, Black, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --retries 10 --timeout 120 --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install --retries 10 --timeout 120 -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      # Redis rate limiter tests use in-memory FakeRedis; no external Redis or REDIS_URL secret is used in CI.
      - run: pytest -q

  docker-postgres:
    name: Docker and pgvector benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip download --retries 10 --timeout 120 --dest wheels --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - run: docker compose config -q
      - run: docker compose build app
      - run: docker compose up -d db
      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U schemadrill_admin -d schemadrill; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - run: docker compose run --rm app python -m eval.benchmark
      - name: Ingest Chinook schema embeddings
        run: docker compose run --rm app python -m ingest.schema_ingest chinook
      - name: Run Chinook evaluator smoke test
        run: |
          docker compose run --rm app sh -c \
            'output=$(python -m evaluation.runner --gold-as-generated --dataset chinook) &&
             echo "$output" &&
             python -c "import json, sys; data = json.loads(sys.argv[1]); assert data[\"result_set_accuracy\"] == 1.0 and data[\"execution_success_rate\"] == 1.0 and data[\"execution_accuracy\"] == 1.0, data" "$output"'
      - name: Run live Gemini Chinook evaluation (when GEMINI_API_KEY secret is configured)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            docker compose run --rm -e GEMINI_API_KEY app sh -c \
              'python -m evaluation.runner --dataset chinook --output /tmp/chinook-live.jsonl &&
               python -c "import json; lines = [json.loads(line) for line in open(\"/tmp/chinook-live.jsonl\") if line.strip()]; summary = lines[-1][\"summary\"]; assert summary[\"result_set_accuracy\"] == 1.0 and summary[\"execution_success_rate\"] == 1.0 and summary[\"execution_accuracy\"] == 1.0, summary"'
          else
            echo "GEMINI_API_KEY secret not set; skipping live Gemini call in GitHub Actions (enforced in Cloud Build)"
          fi
      - name: Run instrumented benchmark smoke test
        run: |
          docker compose run --rm app sh -c \
            'python -m evaluation.run_benchmark \
              --questions evaluation/chinook/cases.json \
              --dataset chinook \
              --gold-as-generated \
              --output-dir /tmp/schemadrill-benchmark &&
             python -c "import glob, json; files = glob.glob(\"/tmp/schemadrill-benchmark/*_summary.json\"); assert len(files) == 1, files; data = json.load(open(files[0])); cfg = data[\"configurations\"][\"default\"]; assert cfg[\"result_set_accuracy\"] == 1.0 and cfg[\"sql_execution_success_rate\"] == 1.0, cfg"'
      - name: Run synthetic dataset registry smoke test
        run: |
          docker compose run --rm app sh -c \
            'python -m evaluation.run_benchmark \
              --all-datasets \
              --gold-as-generated \
              --initialize \
              --output-dir /tmp/schemadrill-multidataset &&
             python -c "import glob, json; files = glob.glob(\"/tmp/schemadrill-multidataset/*_summary.json\"); assert len(files) == 4, files; summaries = [json.load(open(f)) for f in files]; assert {s[\"dataset\"] for s in summaries} == {\"chinook\", \"ecommerce\", \"organization\", \"complex_synthetic\"}; assert all(s[\"configurations\"][\"default\"][\"result_set_accuracy\"] == 1.0 and s[\"configurations\"][\"default\"][\"sql_execution_success_rate\"] == 1.0 for s in summaries), summaries"'
      - run: docker compose up -d app
      - name: Check API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down -v

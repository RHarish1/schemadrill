steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "."

  - name: "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
    entrypoint: "pytest"
    args:
      - "-q"

  - name: "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
    entrypoint: "python"
    secretEnv:
      - "DATABASE_URL"
      - "GEMINI_API_KEY"
    args:
      - "-c"
      - |
        import json, subprocess
        subprocess.run(
            ["python", "-m", "evaluation.runner", "--dataset", "chinook", "--output", "/tmp/chinook-eval.jsonl"],
            check=True,
        )
        with open("/tmp/chinook-eval.jsonl", encoding="utf-8") as fh:
            lines = [json.loads(line) for line in fh if line.strip()]
        summary = lines[-1]["summary"]
        assert (
            summary["result_set_accuracy"] == 1.0
            and summary["execution_success_rate"] == 1.0
            and summary["execution_accuracy"] == 1.0
        ), summary

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "schemadrill"
      - "--image"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--update-secrets"
      - "DATABASE_URL=schemadrill-database-url:latest,INGEST_DATABASE_URL=schemadrill-database-url:latest,GEMINI_API_KEY=schemadrill-gemini-api-key:latest,REDIS_URL=schemadrill-redis-url:latest"
      - "--quiet"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/schemadrill-database-url/versions/latest"
      env: "DATABASE_URL"
    - versionName: "projects/$PROJECT_ID/secrets/schemadrill-gemini-api-key/versions/latest"
      env: "GEMINI_API_KEY"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

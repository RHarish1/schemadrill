steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "schemadrill"
      - "--image"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--quiet"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

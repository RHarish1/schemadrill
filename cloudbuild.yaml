steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "."

  - name: "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
    entrypoint: "pytest"
    args:
      - "-q"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "python3"
    args:
      - "-c"
      - |
        import json, subprocess
        raw = subprocess.check_output([
            "gcloud", "run", "services", "describe", "schemadrill",
            "--region", "asia-south1", "--format", "json"
        ], text=True)
        service = json.loads(raw)
        envs = service["spec"]["template"]["spec"]["containers"][0].get("env", [])
        wanted = {"DATABASE_URL", "GEMINI_API_KEY", "MODEL_NAME", "EMBEDDING_MODEL"}
        with open("/workspace/.cloudbuild.env", "w", encoding="utf-8") as fh:
            for item in envs:
                if item.get("name") in wanted and "value" in item:
                    fh.write(f"{item['name']}={item['value']}\n")

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        trap 'rm -f /workspace/.cloudbuild.env' EXIT
        docker run --rm --env-file /workspace/.cloudbuild.env \
          "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA" \
          sh -c 'python -m evaluation.runner --dataset chinook --output /tmp/chinook-eval.jsonl &&
                 python -c "import json; lines = [json.loads(line) for line in open(\"/tmp/chinook-eval.jsonl\") if line.strip()]; summary = lines[-1][\"summary\"]; assert summary[\"result_set_accuracy\"] == 1.0 and summary[\"execution_success_rate\"] == 1.0 and summary[\"execution_accuracy\"] == 1.0, summary"'

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "schemadrill"
      - "--image"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--quiet"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/schemadrill:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

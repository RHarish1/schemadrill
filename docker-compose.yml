services:
  db:
    image: pgvector/pgvector:pg16
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U schemadrill_admin -d schemadrill" ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: schemadrill
      POSTGRES_USER: schemadrill_admin
      POSTGRES_PASSWORD: schemadrill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./scripts/load_demo_dbs.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://schemadrill_readonly:schemadrill@db:5432/schemadrill
      INGEST_DATABASE_URL: postgresql://schemadrill_admin:schemadrill@db:5432/schemadrill
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
